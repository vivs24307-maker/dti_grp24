<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <!-- Original CineVerse title card (not the official poster). Replace this file, or set a poster URL in the admin dashboard. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150a2b"/>
      <stop offset="0.38" stop-color="#5a1230"/>
      <stop offset="0.66" stop-color="#c2461c"/>
      <stop offset="1" stop-color="#f6a623"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.35" stop-color="#ffd27a"/>
      <stop offset="0.7" stop-color="#ff9a2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
